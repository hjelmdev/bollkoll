<aside class="workout-feedback" aria-label="Återkoppling från träningen">
  <div class="feedback-copy">
    <strong>@if (nickname(); as name) {Bra jobbat, {{ name }}!} @else {Bra jobbat!}</strong>
    <p>Ditt pass är sparat.</p>
  </div>

  @if (!nickname()) {
    <div class="profile-invitation">
      <span>Gör profilen personlig med ett smeknamn.</span>
      <button type="button" (click)="profileIsOpen() ? nicknameRequested.emit() : profileRequested.emit()">
        {{ profileIsOpen() ? 'Välj smeknamn' : 'Gå till profilen' }}
      </button>
    </div>
  }
</aside>
